<style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const def=()=>({icp:'',me:'',avail:'',leads:[],meetings:[],profile:{},auto:{on:false,hours:6,q:'react OR frontend',region:'eu,uk',seniority:'',days:14,last:0,msg:''}});
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem('amb')||'null')||{})}catch(e){return def()}}
let S=def(),tab='leads',busy='',sample=true,sampleOk=true,dirty=false,rev=0;
let st=null;const save=()=>{dirty=true;clearTimeout(st);st=setTimeout(async()=>{try{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:S,rev})});const j=await r.json();if(r.status===409)await pull(true);else{rev=j.rev;dirty=false}}catch(e){}},800)};
async function pull(force){try{if(!force){const q=await(await fetch('/api/rev')).json();if(dirty||q.rev===rev)return}const j=await(await fetch('/api/state')).json();if(force||(!dirty&&j.rev!==rev)){S=Object.assign(def(),j.state);rev=j.rev;dirty=false;const a=document.activeElement;if(force||!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))render()}}catch(e){}}
setInterval(()=>pull(false),15000);pull(true);
sample=true;sampleOk=true;

const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
async function ask(prompt){const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error del servidor');return JSON.parse(j.text.replace(/```json|```/g,'').trim())}
function parseLeads(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[,|;]/).map(x=>x.trim());return{id:Date.now()+Math.random(),name:p[0]||'',role:p[1]||'',company:p[2]||'',note:p.slice(3).join(', '),status:'new'}})}
async function scoreAll(){
  const todo=S.leads.filter(l=>l.status==='new');
  for(let i=0;i<todo.length;i++){const l=todo[i];busy=`Procesando ${i+1} de ${todo.length}…`;render();
    try{const r=await ask(`Eres asistente de prospección B2B. Mi oferta: ${S.me}\nCliente ideal: ${S.icp}\nProspecto: ${l.name}, ${l.role}, ${l.company}. Notas: ${l.note}\nDevuelve SOLO JSON: {"score":0-100,"reason":"una frase","message":"mensaje de LinkedIn en español, máximo 60 palabras, cercano, sin inventar datos que no estén arriba, termina con una pregunta"}`);
      l.score=r.score;l.reason=r.reason;l.msg=r.message;l.status='drafted'}catch(e){busy='Error: '+(e.message||e.code||'no se pudo');render();return}
    save()}
  busy='';tab='approve';render()}
async function analyze(id){
  const l=S.leads.find(x=>x.id===id);const t=l.reply||'';if(!t)return;busy='Analizando…';render();
  try{const r=await ask(`Respuesta de un prospecto a mi mensaje de LinkedIn: «${t}»\nMi disponibilidad: ${S.avail||'sin indicar'}\nDevuelve SOLO JSON: {"intent":"interesado|pregunta|ahora no|no","suggested":"respuesta en español, breve; si hay interés propón hasta 3 horarios de mi disponibilidad; si no, cierra con amabilidad"}`);
    l.intent=r.intent;l.suggested=r.suggested;l.status='replied';save()}catch(e){busy='Error: '+(e.message||e.code||'no se pudo');render();return}
  busy='';render()}
const IC={leads:'remolino',approve:'check',replies:'reloj',meets:'calendario',cv:'estrella'},SC={leads:'portal',approve:'oficina',replies:'escribiendo'};
const banner=t=>SC[t]?`<img class="ban" src="/assets/booker-brody/scenes/${SC[t]}.webp" alt="" loading="lazy">`:'';
function csv(t){const r=[];let row=[],f='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x))r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);if(row.some(x=>x))r.push(row)}return r}
function rows(t){const a=csv(t);while(a.length&&a[0].filter(Boolean).length<2)a.shift();if(!a.length)return[];const k=a.shift().map(x=>x.trim().toLowerCase());return a.map(r=>Object.fromEntries(k.map((n,i)=>[n,(r[i]||'').trim()])))}
const pick=(r,...n)=>{for(const k of n)if(r[k])return r[k];return''};
async function importLinkedIn(files){
  const P=S.profile,out=[],ign=[];let n={};
  for(const f of files){const nm=f.name.toLowerCase(),R=rows(await f.text());
    if(nm.includes('position')){P.experience=R.map(r=>`${pick(r,'title')} - ${pick(r,'company name','company')} (${pick(r,'started on','start date')} - ${pick(r,'finished on','end date')||'actualidad'}). ${pick(r,'description')}`.trim()).join('\n');n.puestos=R.length}
    else if(nm.includes('education')){P.education=R.map(r=>`${pick(r,'degree name','degree')} - ${pick(r,'school name','school')} (${pick(r,'start date')} - ${pick(r,'end date')})`).join('\n');n.estudios=R.length}
    else if(nm.includes('skill')){P.skills=R.map(r=>pick(r,'name')).filter(Boolean).join(', ');n.habilidades=R.length}
    else if(nm.includes('language')){P.languages=R.map(r=>pick(r,'name')+(pick(r,'proficiency')?` (${pick(r,'proficiency')})`:'')).join(', ');n.idiomas=R.length}
    else if(nm.includes('email')){const m=R.find(r=>/yes|true|sí|si/i.test(r.primary))||R[0];if(m&&!P.email)P.email=pick(m,'email address')}
    else if(nm.startsWith('profile')){const r=R[0]||{};if(!P.name)P.name=(pick(r,'first name')+' '+pick(r,'last name')).trim();if(!P.title&&pick(r,'headline'))P.title=pick(r,'headline');if(!P.summary&&pick(r,'summary'))P.summary=pick(r,'summary');if(!P.location&&pick(r,'geo location','address'))P.location=pick(r,'geo location','address');n.perfil=1}
    else ign.push(f.name)}
  save();return Object.entries(n).map(([k,v])=>`${v} ${k}`).join(', ')+(ign.length?` · No reconocidos: ${ign.join(', ')}`:'')}
let lim=30;const sortL=()=>[...S.leads].sort((a,b)=>(b.score??-1)-(a.score??-1));
const cvOpts=()=>{const t=sortL().slice(0,150),s=S.leads.find(x=>String(x.id)===String(cvLead));return s&&!t.includes(s)?[s,...t]:t};
const leadsBar=()=>{const N=S.leads.length,n=S.leads.filter(l=>l.status==='new').length;return N?`<div class="card row"><span class="sp mut">Mostrando ${Math.min(lim,N)} de ${N} leads, ordenados por encaje</span>${n?`<button id="clr">Borrar los no procesados (${n})</button>`:''}</div>`:''};
const leadsMore=()=>S.leads.length>lim?`<div class="row"><button id="more">Mostrar más (${S.leads.length-lim})</button></div>`:'';
let flash=false,cvLead='',slide=0;const wk=()=>/…|puede tardar/.test(busy);const arr=x=>Array.isArray(x)?x:[],J={'Content-Type':'application/json'};const M='/assets/booker-brody/mascot/';
const empty=(t,img='booker-principal-160')=>`<div class="card empty"><img src="${M}${img.endsWith('360')?img+'.webp':img+'.webp'}" alt="" loading="lazy"><p>${t}</p></div>`;
const link=l=>{const m=(l.note||'').match(/https?:\/\/\S+/);return m?`<a href="${esc(m[0])}" target="_blank" rel="noopener" style="color:var(--ac)">Ver oferta ↗</a> `:''};
const PK=['name','title','email','phone','location','links','summary','skills','experience','education','languages','projects'];
let cvNotes='',cvQs=[],offer={company:'',role:'',desc:''};
const b64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>ko(new Error('No se pudo leer el archivo'));r.readAsDataURL(f)});
async function parseInto(body){const r=await fetch('/api/cv/parse',{method:'POST',headers:J,body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Error del servidor');
  const P=S.profile;for(const k of PK)if(j.profile[k])P[k]=j.profile[k];cvQs=arr(j.preguntas);save();busy='Perfil rellenado. Revisa y corrige los campos de abajo antes de crear el CV.'}
const startCard=()=>`<div class="card"><b>Empieza aquí: tu perfil base</b><div class="mut">Sube tu CV o créalo desde cero. Después puedes corregir todo a mano.</div>
<label>A) Subir mi CV actual (PDF, DOCX o TXT)</label><input type="file" id="cvfile" accept=".pdf,.docx,.txt,.md"><div class="row"><button id="cvup" ${wk()?'disabled':''}>Leer mi CV y rellenar el perfil</button></div>

const WZ_STEPS=(L)=>{const A=S.auto,fill=v=>!!String(v||'').trim();

function wizard(L){const st=WZ_STEPS(L),n=st.length;
return `<div class="car"><div class="carhead"><span id="cnt">Paso 1 de ${n}</span><span class="mut">Desliza → o usa los botones</span></div><div class="progress"><i id="bar"></i></div>
<div class="trk">${st.map((s,i)=>`<section class="sl"><div class="stepn">Paso ${i+1} · ${esc(s.n)}</div>${s.h}</section>`).join('')}</div>
<div class="carnav"><button type="button" id="cprev">← Anterior</button><div class="dots">${st.map((s,i)=>`<button type="button" class="dot ${s.ok?'done':''}" data-goto="${i}" aria-label="Paso ${i+1}: ${esc(s.n)}"></button>`).join('')}</div><button type="button" class="pri" id="cnext">Siguiente →</button></div></div>`}
function carBind(){const t=document.querySelector('.trk');if(!t)return;const n=t.children.length,q=s=>document.querySelector(s),pitch=()=>t.children[1].offsetLeft-t.children[0].offsetLeft;
const upd=()=>{q('#cnt').textContent='Paso '+(slide+1)+' de '+n;q('#bar').style.width=((slide+1)/n*100)+'%';document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===slide));q('#cprev').disabled=slide===0;q('#cnext').disabled=slide===n-1};
const go=(i,smooth)=>{i=Math.max(0,Math.min(n-1,i));slide=i;t.scrollTo({left:t.children[i].offsetLeft,behavior:smooth?'smooth':'auto'});upd()};
go(slide,false);window.onresize=()=>go(slide,false);
t.onscroll=()=>{const i=Math.round(t.scrollLeft/pitch());if(i!==slide){slide=i;upd()}};
q('#cprev').onclick=()=>go(slide-1,true);q('#cnext').onclick=()=>go(slide+1,true);
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(+b.dataset.goto,true));
document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const f=q('#'+b.dataset.ex);f.value=b.dataset.txt;f.dispatchEvent(new Event('input'))});
let dn=false,x0=0,s0=0;
t.onmousedown=e=>{if(e.target.closest('input,textarea,select,button,a,label'))return;dn=true;x0=e.clientX;s0=t.scrollLeft;t.style.scrollSnapType='none';t.classList.add('drag')};
window.onmousemove=e=>{if(dn)t.scrollLeft=s0-(e.clientX-x0)};
window.onmouseup=()=>{if(!dn)return;dn=false;t.style.scrollSnapType='';t.classList.remove('drag');go(Math.round(t.scrollLeft/pitch()),true)};
if(!window._ck){window._ck=1;document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')q('#cnext')&&q('#cnext').click();if(e.key==='ArrowLeft')q('#cprev')&&q('#cprev').click()})}}

function bind(){

    g('#go').onclick=scoreAll;
    if(g('#more'))g('#more').onclick=()=>{lim+=50;render()};
    if(g('#clr'))g('#clr').onclick=async()=>{if(!confirm('¿Borrar los leads que aún no se han puntuado? Los demás se conservan.'))return;try{await fetch('/api/leads/clear',{method:'POST'})}catch(e){}await pull(true)};
    const A=S.auto;g('#fr').value=A.region;g('#fs').value=A.seniority;
    for(const [id,k] of [['#fq','q'],['#fr','region'],['#fs','seniority'],['#fd','days']])g(id).oninput=g(id).onchange=e=>{A[k]=e.target.value;save()};
    g('#week').onclick=()=>{g('#fd').value=7;A.days=7;save();g('#find').click()};
    g('#aon').onchange=e=>{A.on=e.target.checked;save()};g('#ah').oninput=e=>{A.hours=+e.target.value||6;save()};
    g('#arun').onclick=async()=>{busy='Ejecutando… puede tardar';render();try{await fetch('/api/run',{method:'POST'})}catch(e){}busy='';await pull(true)};
    g('#find').onclick=async()=>{busy='Buscando empresas…';render();
      try{const q=new URLSearchParams({q:g('#fq').value,region:g('#fr').value,seniority:g('#fs').value,days:g('#fd').value,limit:40});
        const r=await fetch('/api/leads?'+q),j=await r.json();if(!r.ok)throw new Error(j.error);
        const have=new Set(S.leads.map(l=>l.company.toLowerCase()));let n=0;
        for(const l of j.leads){const k=l.company.toLowerCase();if(have.has(k))continue;have.add(k);S.leads.push({id:Date.now()+Math.random(),status:'new',...l});n++}
        save();busy=j.warn||`${n} empresas nuevas añadidas.`}catch(e){busy='Error: '+e.message}render()}}
  on('[data-del]',b=>b.onclick=()=>{S.leads=S.leads.filter(l=>String(l.id)!==b.dataset.del);save();render()});
  const f=id=>S.leads.find(l=>String(l.id)===String(id));
  on('[data-msg]',t=>t.oninput=()=>{f(t.dataset.msg).msg=t.value;save()});
  on('[data-send]',b=>b.onclick=async()=>{const l=f(b.dataset.send);try{await navigator.clipboard.writeText(l.msg)}catch(e){}l.status='sent';save();render()});
  on('[data-li]',b=>b.onclick=async()=>{const l=f(b.dataset.li);try{await navigator.clipboard.writeText(l.msg)}catch(e){}window.open('https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(l.company+' CTO OR engineering manager OR head of engineering'),'_blank')});
  if(g('#liimp'))g('#liimp').onclick=async()=>{const fs=[...g('#lifiles').files];if(!fs.length){busy='Selecciona primero los archivos CSV.';render();return}
    try{const r=await importLinkedIn(fs);busy=r?'Importado: '+r:'No reconocí ningún archivo. Usa Positions.csv, Education.csv, Skills.csv, Languages.csv o Profile.csv.'}catch(e){busy='Error al leer: '+e.message}render()};
  on('[data-cv]',b=>b.onclick=()=>{cvLead=b.dataset.cv;tab='cv';render()});
  on('[data-p]',t=>t.oninput=()=>{S.profile[t.dataset.p]=t.value;save()});

    g('#ofuse').onclick=()=>{if(!offer.company.trim()||offer.desc.trim().length<40){busy='Escribe la empresa y pega el texto de la oferta.';render();return}

      if(f.size>8e6){busy='El archivo pesa demasiado (máx. 8 MB).';render();return}

      try{const r=await fetch('/api/cv/generate',{method:'POST',headers:J,body:JSON.stringify({profile:S.profile,lead:{id:l.id,role:l.role,company:l.company,note:l.note,desc:l.desc}})});const j=await r.json();if(!r.ok)throw new Error(j.error);l.cv=j.cv;save();busy=''}catch(e){busy='Error: '+e.message}render()};
    if(g('#cvpdf')){
      g('#cvpdf').onclick=async()=>{const l=f(cvLead);try{const r=await fetch('/api/cv/pdf',{method:'POST',headers:J,body:JSON.stringify({profile:S.profile,cv:l.cv})});if(!r.ok)throw new Error((await r.json()).error);const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=`CV-${S.profile.name||'candidato'}-${l.company}.pdf`.replace(/\s+/g,'-');a.click()}catch(e){busy='Error: '+e.message;render()}};
      g('#cvsend').onclick=async()=>{const l=f(cvLead),to=g('#cvto').value.trim();l.to=to;save();
        if(!/^\S+@\S+\.\S+$/.test(to)){busy='Escribe un correo de empresa válido.';render();return}
        if(!confirm(`¿Enviar tu CV a ${to} (${l.company})?`))return;busy='Enviando…';render();
        try{const r=await fetch('/api/cv/send',{method:'POST',headers:J,body:JSON.stringify({profile:S.profile,cv:l.cv,to,subject:l.cv.asunto,body:l.cv.email})});const j=await r.json();if(!r.ok)throw new Error(j.error);l.cvSent=Date.now();save();busy='CV enviado a '+to}catch(e){busy='Error: '+e.message}render()}}}
  on('[data-skip]',b=>b.onclick=()=>{f(b.dataset.skip).status='lost';save();render()});
  on('[data-rep]',t=>t.oninput=()=>{f(t.dataset.rep).reply=t.value;save()});
  on('[data-an]',b=>b.onclick=()=>analyze(f(b.dataset.an).id));
  on('[data-lost]',b=>b.onclick=()=>{f(b.dataset.lost).status='lost';save();render()});
  on('[data-book]',b=>b.onclick=()=>{const l=f(b.dataset.book),w=document.querySelector(`[data-when="${b.dataset.book}"]`).value;if(!w)return;S.meetings.push({when:w,name:l.name,company:l.company});l.status='booked';save();tab='meets';flash=true;setTimeout(()=>{flash=false;if(tab==='meets')render()},4000);render()});
}
render();
</script></body></html>
